<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヨミドーパを応援する</title>
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="bar"><a class="back" href="./">‹ ヨミドーパ</a></header>
<main class="page">
  <h1>ヨミドーパを応援する</h1>
  <p>ヨミドーパの作品は、すべて無料で読めます。応援はなくても、読める作品や機能は変わりません。いただいた応援は、サーバー代や作品を増やす作業に使わせていただきます。</p>

  <section class="box">
    <h2>1回だけ応援する</h2>
    <div class="pay" data-pay="support.once"></div>
    <p class="note">クレジットカード、Apple Pay、Google Pay などで支払えます(決済は Stripe のページで行います)。</p>
  </section>

  <section class="box">
    <h2>毎月応援する</h2>
    <div class="pay" data-pay="support.monthly"></div>
    <p class="note">毎月自動で支払われます。いつでも解約でき、解約した月の翌月からは請求されません。解約のしかたは、支払い完了後に届くメールに書かれています。</p>
  </section>

  <p class="note">お支払いの前に、<a href="tokushoho.html">特定商取引法に基づく表記</a>をご確認ください。</p>
</main>
<script type="module" src="page.js"></script>
</body>
</html>
